name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: priceprediction

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<3" "scikit-learn>=1.5,<1.10" "imbalanced-learn==0.14.2" "scipy>=1.14,<2" "requests>=2.31,<3" "joblib>=1.3,<2" "python-dateutil>=2.8,<3"
      - name: Run deterministic Python tests
        env:
          DEMO_MODE: 'true'
          FAST_PATH_MODEL_STATE: '0'
        run: python -m unittest test_prediction_history test_history_integration test_forecasting_backends test_class_balancing -v

  client:
    name: React client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install client dependencies
        run: npm install
      - name: Build client
        env:
          CI: 'true'
        run: npm run build

  docker:
    name: Docker validation
    runs-on: ubuntu-latest
    needs: [python-tests, client]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: priceprediction:${{ github.sha }}
          cache-from: type=gha,scope=priceprediction
          cache-to: type=gha,mode=max,scope=priceprediction
      - name: Smoke-test image imports
        run: docker run --rm --entrypoint python priceprediction:${{ github.sha }} -c "import numpy, pandas, scipy, sklearn, imblearn, requests, joblib, class_balancing, weighted_voting, services.history_runtime; print('Python runtime imports: OK')"
      - name: Check image metadata
        run: docker image inspect priceprediction:${{ github.sha }}