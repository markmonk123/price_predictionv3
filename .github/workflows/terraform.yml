# .github/workflows/terraform.yml @ ref a181e6187478cea4fcee56839a3188af7a6ff8a7

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Terraform files
        id: tfcheck
        run: |
          if ls -1 **/*.tf 1>/dev/null 2>&1; then
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.tfcheck.outputs.has_tf == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        if: steps.tfcheck.outputs.has_tf == 'true'
        run: terraform init

      - name: Terraform Format
        if: steps.tfcheck.outputs.has_tf == 'true'
        run: terraform fmt -check

      - name: Terraform Plan
        if: steps.tfcheck.outputs.has_tf == 'true'
        run: terraform plan -input=falseove -input=false
