# .github/workflows/terraform.yml
name: Terraform

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Terraform files
        id: tfcheck
        run: |
          tf_dir="$(find . -type f -name '*.tf' -not -path '*/.terraform/*' | head -n1 | xargs -I{} dirname "{}")"
          if [[ -n "$tf_dir" ]]; then
            echo "has_tf=true" >> "$GITHUB_OUTPUT"
            echo "tf_dir=$tf_dir" >> "$GITHUB_OUTPUT"
          else
            echo "has_tf=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.tfcheck.outputs.has_tf == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        if: steps.tfcheck.outputs.has_tf == 'true'
        working-directory: ${{ steps.tfcheck.outputs.tf_dir }}
        run: terraform init

      - name: Terraform Format
        if: steps.tfcheck.outputs.has_tf == 'true'
        working-directory: ${{ steps.tfcheck.outputs.tf_dir }}
        run: terraform fmt -check

      - name: Terraform Plan
        if: steps.tfcheck.outputs.has_tf == 'true'
        working-directory: ${{ steps.tfcheck.outputs.tf_dir }}
        run: terraform plan -input=false
