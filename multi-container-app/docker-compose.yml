version: '3.8'

services:
  python-node:
    build:
      context: ./python-node-container
      dockerfile: Dockerfile
    volumes:
      - ./python-node-container:/app
    working_dir: /app
    command: ["sh", "-c", "npm install && python app.py"]
  
  vscode-react:
    build:
      context: ./vscode-react-container
      dockerfile: Dockerfile
    volumes:
      - ./vscode-react-container:/app
    working_dir: /app
    command: ["sh", "-c", "npm install && npm start"]
    ports:
      - "3000:3000"